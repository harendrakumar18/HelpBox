name: ${COMPOSE_PROJECT_NAME:-helpbox_simple_agent_pack_v3}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: ${POSTGRES_CONTAINER_NAME:-helpbox-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpbox}
      POSTGRES_USER: ${POSTGRES_USER:-helpbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpbox} -d ${POSTGRES_DB:-helpbox}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-helpbox_simple_agent_pack_v3_helpbox_postgres_data}

